sonar.projectKey=cicd-app
sonar.projectName=cicd-app
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.exclusions=tests/**,devops/**,jenkins/**,.venv/**,**/__pycache__/**
sonar.tests=tests
sonar.python.version=3.12

# Produced by pytest in the "Lint & Test" stage
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
